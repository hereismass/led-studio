[package]
name = "led-studio-desktop"
version = "0.1.0"
description = "A desktop editor for LED lighting projects"
authors = ["LED Studio contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "led_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
